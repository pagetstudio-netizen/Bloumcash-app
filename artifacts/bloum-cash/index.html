<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Bloum Cash</title>
    <meta name="description" content="Bloum Cash — Transferts TMoney &amp; Moov Money au Togo, paiements QR Code." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Bloum Cash" />
    <meta property="og:description" content="Transferts TMoney &amp; Moov Money, paiements QR Code au Togo." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bloum Cash" />
    <meta name="twitter:description" content="Transferts TMoney &amp; Moov Money, paiements QR Code au Togo." />
    <link rel="icon" type="image/png" href="/logo-512.png" />
    <link rel="apple-touch-icon" href="/logo-512.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      /* ── Écran de chargement natif (pur CSS, zéro JS requis) ── */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1a3fc4 0%, #2b50e8 100%);
        font-family: 'Inter', system-ui, sans-serif;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #app-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Logo */
      .al-logo-wrap {
        width: 96px;
        height: 96px;
        background: #fff;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        overflow: hidden;
        animation: al-pop 0.55s cubic-bezier(0,0.71,0.2,1.01) both;
      }
      .al-logo-wrap img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .al-title {
        margin-top: 18px;
        color: #fff;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.3px;
        animation: al-pop 0.55s 0.08s cubic-bezier(0,0.71,0.2,1.01) both;
      }

      /* Barres de chargement */
      .al-bars {
        position: absolute;
        bottom: 56px;
        display: flex;
        align-items: flex-end;
        gap: 5px;
        height: 24px;
        animation: al-fadein 0.3s 0.5s both;
      }
      .al-bar {
        width: 4px;
        border-radius: 3px;
        background: rgba(255,255,255,0.9);
        animation: al-bounce 1.1s ease-in-out infinite;
      }
      .al-bar:nth-child(1) { height: 10px; animation-delay: 0s;    }
      .al-bar:nth-child(2) { height: 16px; animation-delay: 0.15s; }
      .al-bar:nth-child(3) { height: 22px; animation-delay: 0.30s; }
      .al-bar:nth-child(4) { height: 16px; animation-delay: 0.45s; }
      .al-bar:nth-child(5) { height: 10px; animation-delay: 0.60s; }


      @keyframes al-pop {
        from { opacity: 0; transform: scale(0.82); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes al-fadein {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes al-bounce {
        0%, 100% { transform: scaleY(0.55); opacity: 0.5; }
        50%       { transform: scaleY(1);    opacity: 1;   }
      }

      /* Empêcher le flash blanc avant React */
      body { margin: 0; background: #1a3fc4; }
      #root { min-height: 100dvh; }
    </style>
  </head>
  <body>
    <!-- Écran de chargement natif — visible dès le premier octet, retiré par React -->
    <div id="app-loader" role="status" aria-label="Chargement de Bloum Cash">
      <div class="al-logo-wrap">
        <img src="/logo-512.png" alt="Bloum Cash" fetchpriority="high" decoding="async" />
      </div>
      <div class="al-title">Bloum Cash</div>

      <!-- Petites barres animées en bas -->
      <div class="al-bars" aria-hidden="true">
        <div class="al-bar"></div>
        <div class="al-bar"></div>
        <div class="al-bar"></div>
        <div class="al-bar"></div>
        <div class="al-bar"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
